<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#180f17">
    <meta name="description" content="Original lyrics and soulful songs by Manoj Maurya 'Yaayavar'. Listen on Spotify, Apple Music, YouTube Music and Amazon Music.">
    <meta property="og:title" content="ManojYaayavar | Poet & Lyricist">
    <meta property="og:description" content="Original lyrics. Songs from the heart. Listen to ManojYaayavar.">
    <meta property="og:image" content="face_pen_final.png">
    <meta property="og:type" content="website">
    <title>ManojYaayavar | Original Lyrics & Songs</title>
    <link rel="icon" type="image/png" href="face_pen_final.png">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink: #fffaf4;
            --muted: #cdbfc7;
            --surface: rgba(255, 255, 255, 0.075);
            --surface-strong: rgba(255, 255, 255, 0.12);
            --line: rgba(255, 255, 255, 0.12);
            --accent: #f2a27f;
            --accent-light: #ffd1b8;
            --deep: #180f17;
            --radius: 22px;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 14% 5%, rgba(176, 66, 111, 0.42), transparent 32rem),
                radial-gradient(circle at 90% 28%, rgba(211, 111, 75, 0.22), transparent 28rem),
                linear-gradient(155deg, #2d1425 0%, var(--deep) 55%, #101318 100%);
            background-attachment: fixed;
        }

        button, input { font: inherit; }

        a { color: inherit; }

        .page-shell {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: 34px 18px 44px;
        }

        .profile {
            position: relative;
            display: grid;
            justify-items: center;
            text-align: center;
            padding: 14px 10px 22px;
        }

        .profile__image-wrap {
            position: relative;
            width: 102px;
            height: 102px;
            margin-bottom: 16px;
        }

        .profile__image-wrap::after {
            content: "";
            position: absolute;
            inset: -5px;
            border: 1px solid rgba(255, 209, 184, 0.52);
            border-radius: 50%;
        }

        .profile__image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #f7e5da;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.35);
        }

        .profile__eyebrow {
            margin: 0 0 7px;
            color: var(--accent-light);
            font-size: 0.72rem;
            font-weight: 750;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .profile__name {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 500;
            letter-spacing: -0.035em;
        }

        .profile__bio {
            max-width: 470px;
            margin: 9px auto 15px;
            color: var(--muted);
            font-size: 0.96rem;
            line-height: 1.6;
            white-space: pre-line;
        }

        .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 8px 13px;
            color: var(--ink);
            font-size: 0.88rem;
            font-weight: 650;
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            transition: 160ms ease;
        }

        .instagram-link:hover {
            border-color: rgba(255, 209, 184, 0.55);
            background: var(--surface-strong);
            transform: translateY(-1px);
        }

        .instagram-link i {
            color: transparent;
            font-size: 1rem;
            background: radial-gradient(circle at 30% 107%, #fdf497 0 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
            background-clip: text;
            -webkit-background-clip: text;
        }

        .section { margin-top: 24px; }

        .section-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 15px;
            margin: 0 4px 12px;
        }

        .section-kicker {
            display: block;
            margin-bottom: 4px;
            color: var(--accent-light);
            font-size: 0.69rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .section-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.55rem;
            font-weight: 500;
        }

        .featured {
            position: relative;
            display: grid;
            grid-template-columns: minmax(180px, 0.8fr) 1.2fr;
            gap: clamp(20px, 5vw, 38px);
            padding: clamp(16px, 4vw, 26px);
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 28px;
            background:
                linear-gradient(140deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.045)),
                rgba(25, 15, 23, 0.68);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(18px);
        }

        .featured::before {
            content: "";
            position: absolute;
            width: 210px;
            height: 210px;
            right: -70px;
            bottom: -110px;
            border-radius: 50%;
            background: rgba(242, 162, 127, 0.16);
            filter: blur(18px);
            pointer-events: none;
        }

        .featured__art {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            background: linear-gradient(145deg, #754258, #d08469);
            box-shadow: 0 18px 38px rgba(0, 0, 0, 0.35);
        }

        .featured__copy {
            position: relative;
            align-self: center;
            min-width: 0;
        }

        .release-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 12px;
            color: var(--accent-light);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .release-label::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 5px rgba(242, 162, 127, 0.13);
        }

        .featured__title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.65rem, 5vw, 2.55rem);
            font-weight: 500;
            line-height: 1.08;
        }

        .featured__subtitle {
            margin: 8px 0 18px;
            color: var(--muted);
            font-size: 1rem;
        }

        .platforms {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .featured .platforms {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .platform-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 42px;
            padding: 9px 13px;
            color: var(--ink);
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.075);
            transition: 160ms ease;
        }

        .featured .platform-link { width: 100%; }

        .platform-link:hover {
            color: #24131d;
            border-color: var(--accent-light);
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        .platform-link i { font-size: 1rem; }

        .artist-links {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .artist-link {
            display: flex;
            min-width: 0;
            min-height: 70px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 11px 5px;
            color: var(--ink);
            font-size: 0.74rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--surface);
            transition: 160ms ease;
        }

        .artist-link:hover {
            border-color: rgba(255, 209, 184, 0.5);
            background: var(--surface-strong);
            transform: translateY(-2px);
        }

        .artist-link i { font-size: 1.35rem; }

        .catalogue-tools {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .search {
            position: relative;
            flex: 1;
        }

        .search i {
            position: absolute;
            top: 50%;
            left: 16px;
            color: var(--muted);
            font-size: 0.88rem;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .search input {
            width: 100%;
            min-height: 50px;
            padding: 12px 16px 12px 44px;
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 15px;
            outline: none;
            background: var(--surface);
            transition: 160ms ease;
        }

        .search input::placeholder { color: #ac9ca6; }

        .search input:focus {
            border-color: rgba(255, 209, 184, 0.62);
            box-shadow: 0 0 0 3px rgba(242, 162, 127, 0.1);
        }

        .song-count {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 650;
        }

        .song-list {
            display: grid;
            gap: 10px;
        }

        .song-card {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
            transition: 160ms ease;
        }

        .song-card:hover {
            border-color: rgba(255, 209, 184, 0.34);
            background: rgba(255, 255, 255, 0.095);
        }

        .song-main {
            display: grid;
            grid-template-columns: 64px minmax(0, 1fr) auto;
            align-items: center;
            gap: 14px;
            width: 100%;
            min-height: 86px;
            padding: 10px 12px 10px 10px;
            color: inherit;
            text-align: left;
        }

        .song-art, .song-art-fallback {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: cover;
            background: linear-gradient(145deg, #754258, #d08469);
            box-shadow: 0 7px 17px rgba(0, 0, 0, 0.24);
        }

        .song-art-fallback {
            display: grid;
            place-items: center;
            color: rgba(255, 255, 255, 0.88);
            font-family: Georgia, serif;
            font-size: 1.4rem;
        }

        .song-copy { min-width: 0; }

        .song-title {
            display: block;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.02rem;
            font-weight: 600;
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .song-subtitle {
            display: block;
            overflow: hidden;
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.8rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .song-direct-links {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }

        .previews-disabled .song-main {
            grid-template-columns: 64px minmax(120px, 190px) minmax(190px, 1fr);
        }

        .previews-disabled .song-direct-links {
            width: 100%;
            justify-content: space-around;
            gap: 10px;
        }

        .song-store-link {
            display: inline-grid;
            width: 40px;
            height: 40px;
            place-items: center;
            color: var(--ink);
            font-size: 1.05rem;
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.065);
            transition: 160ms ease;
        }

        .song-preview-button {
            display: inline-flex;
            width: auto;
            min-width: 40px;
            height: 40px;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 0 13px;
            color: #2a1720;
            font-size: 0.76rem;
            font-weight: 800;
            border: 1px solid var(--accent-light);
            border-radius: 11px;
            outline: none;
            background: var(--accent-light);
            box-shadow: 0 6px 16px rgba(242, 162, 127, 0.18);
            cursor: pointer;
            transition: 160ms ease;
        }

        .song-preview-button:hover,
        .song-preview-button:focus-visible {
            background: #ffe3d2;
            transform: translateY(-2px) scale(1.03);
        }

        .song-preview-button.is-playing {
            color: var(--ink);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(242, 162, 127, 0.28);
        }

        .preview-equalizer {
            display: none;
            width: 14px;
            height: 14px;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .preview-equalizer b {
            width: 2px;
            height: 100%;
            border-radius: 99px;
            background: currentColor;
            transform-origin: center;
            animation: equalize 620ms ease-in-out infinite alternate;
        }

        .preview-equalizer b:nth-child(2) {
            animation-duration: 430ms;
            animation-delay: -180ms;
        }

        .preview-equalizer b:nth-child(3) {
            animation-duration: 720ms;
            animation-delay: -310ms;
        }

        .preview-equalizer b:nth-child(4) {
            animation-duration: 510ms;
            animation-delay: -90ms;
        }

        .song-preview-button.is-playing .preview-play-icon { display: none; }
        .song-preview-button.is-playing .preview-equalizer { display: inline-flex; }

        @keyframes equalize {
            0% { transform: scaleY(0.25); opacity: 0.65; }
            55% { transform: scaleY(0.72); opacity: 0.9; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        .song-preview-track {
            height: 3px;
            background: rgba(255, 255, 255, 0.055);
        }

        .song-preview-progress {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            transition: width 100ms linear;
        }

        .song-store-link:hover,
        .song-store-link:focus-visible {
            color: #24131d;
            border-color: var(--accent-light);
            outline: none;
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        .platform-link--spotify i,
        .artist-link--spotify i,
        .song-store-link--spotify i { color: #1ed760; }

        .platform-link--apple i,
        .artist-link--apple i,
        .song-store-link--apple i { color: #fa586a; }

        .platform-link--youtube i,
        .artist-link--youtube i,
        .song-store-link--youtube i { color: #ff4d4d; }

        .platform-link--amazon i,
        .artist-link--amazon i,
        .song-store-link--amazon i { color: #35b8e9; }

        .song-store-link:hover i,
        .song-store-link:focus-visible i { color: inherit; }

        @media (max-width: 440px) {
            .song-title { font-size: 0.92rem; }

            .song-main {
                grid-template-columns: 56px minmax(0, 1fr);
                column-gap: 11px;
                row-gap: 9px;
                align-items: start;
            }

            .song-art, .song-art-fallback {
                grid-row: 1 / span 2;
                width: 56px;
                height: 56px;
            }

            .song-direct-links {
                grid-column: 2;
                display: flex;
                gap: 5px;
            }

            .song-store-link,
            .song-preview-button {
                width: 100%;
                min-width: 0;
                max-width: 34px;
                height: auto;
                flex: 1 1 0;
                aspect-ratio: 1;
                overflow: hidden;
                padding: 0;
                border-radius: 9px;
                font-size: clamp(0.78rem, 4vw, 0.95rem);
            }

            .song-preview-button { border-radius: 50%; }
            .song-preview-button span { display: none; }

            .previews-disabled .song-main {
                grid-template-columns: 56px minmax(0, 1fr);
            }

            .previews-disabled .song-direct-links {
                grid-column: 2;
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                width: 100%;
                max-width: 230px;
                justify-items: center;
                column-gap: clamp(4px, 2vw, 10px);
            }
        }

        .load-more {
            display: none;
            width: 100%;
            min-height: 50px;
            margin-top: 12px;
            color: var(--ink);
            font-weight: 750;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: var(--surface);
            cursor: pointer;
            transition: 160ms ease;
        }

        .load-more:hover { background: var(--surface-strong); }

        .empty-state {
            display: none;
            padding: 28px 18px;
            color: var(--muted);
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 18px;
        }

        .loading {
            padding: 42px 20px;
            color: var(--muted);
            text-align: center;
        }

        .loading i {
            margin-right: 8px;
            color: var(--accent);
        }

        .footer {
            padding: 34px 15px 4px;
            color: #9f9099;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 0.82rem;
            text-align: center;
        }

        @media (max-width: 560px) {
            .page-shell { padding: 22px 12px 34px; }
            .profile { padding-top: 8px; }
            .featured {
                grid-template-columns: minmax(0, 1fr);
                gap: 15px;
                padding: 14px;
                border-radius: 22px;
            }
            .featured__art { border-radius: 14px; }
            .featured__title { font-size: 1.25rem; }
            .featured__subtitle { margin: 5px 0 13px; font-size: 0.88rem; }
            .release-label { margin-bottom: 7px; font-size: 0.63rem; }
            .featured .platforms {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                width: 100%;
            }
            .featured .platform-link span { display: none; }
            .featured .platform-link {
                width: 100%;
                min-width: 0;
                padding: 8px;
            }
        }

        @media (max-width: 390px) {
            .artist-links { grid-template-columns: repeat(2, 1fr); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <header class="profile" id="profile">
            <div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i>Loading music…</div>
        </header>

        <section class="section" id="featured-section" hidden>
            <div class="section-heading">
                <div>
                    <h2 class="section-title">Featured release</h2>
                </div>
            </div>
            <article class="featured" id="featured"></article>
        </section>

        <section class="section" id="artist-section" hidden>
            <div class="section-heading">
                <div>
                    <span class="section-kicker">Follow the music</span>
                    <h2 class="section-title">Listen everywhere</h2>
                </div>
            </div>
            <div class="artist-links" id="artist-links"></div>
        </section>

        <section class="section" id="catalogue-section" hidden>
            <div class="section-heading">
                <div>
                    <span class="section-kicker">Original lyrics & songs</span>
                    <h2 class="section-title">The songbook</h2>
                </div>
            </div>
            <div class="catalogue-tools">
                <label class="search" for="search-input">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input id="search-input" type="search" placeholder="Search by song title…" autocomplete="off">
                </label>
                <span class="song-count" id="song-count"></span>
            </div>
            <div class="song-list" id="song-list"></div>
            <div class="empty-state" id="empty-state">No songs match that search.</div>
            <button class="load-more" id="load-more" type="button">Show more songs</button>
        </section>

        <footer class="footer">Words by Manoj 'Yaayavar' · Songs from the heart</footer>
    </main>

    <script>
        (function () {
            "use strict";

            var PAGE_SIZE = 10;
            var visibleCount = PAGE_SIZE;
            var songs = [];
            var profileData = {};
            var previewEnabled = false;
            var previewPlayer = new Audio();
            var activePreviewButton = null;
            var activeProgressBar = null;
            previewPlayer.preload = "none";
            var platformMeta = {
                spotify: { label: "Spotify", icon: "fa-brands fa-spotify" },
                apple: { label: "Apple Music", icon: "fa-brands fa-apple" },
                youtube: { label: "YouTube Music", icon: "fa-brands fa-youtube" },
                amazon: { label: "Amazon Music", icon: "fa-brands fa-amazon" }
            };

            function validLink(value) {
                return typeof value === "string" && value.trim() !== "" && value.trim() !== "#";
            }

            function escapeHtml(value) {
                return String(value || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            function splitTitle(title) {
                var pieces = String(title || "Untitled").split(/\s+-\s+/);
                return {
                    primary: pieces.shift() || "Untitled",
                    secondary: pieces.join(" - ")
                };
            }

            function platformLinks(links) {
                return Object.keys(platformMeta).filter(function (key) {
                    return links && validLink(links[key]);
                }).map(function (key) {
                    var meta = platformMeta[key];
                    return '<a class="platform-link platform-link--' + key + '" href="' + escapeHtml(links[key]) + '" target="_blank" rel="noopener noreferrer" aria-label="Listen on ' + meta.label + '">' +
                        '<i class="' + meta.icon + '" aria-hidden="true"></i><span>' + meta.label + '</span></a>';
                }).join("");
            }

            function directSongLinks(links) {
                return Object.keys(platformMeta).filter(function (key) {
                    return links && validLink(links[key]);
                }).map(function (key) {
                    var meta = platformMeta[key];
                    return '<a class="song-store-link song-store-link--' + key + '" href="' + escapeHtml(links[key]) + '" target="_blank" rel="noopener noreferrer" aria-label="Listen on ' + meta.label + '" title="Listen on ' + meta.label + '">' +
                        '<i class="' + meta.icon + '" aria-hidden="true"></i></a>';
                }).join("");
            }

            function previewButton(song, title) {
                if (!previewEnabled || !validLink(song.preview)) return "";
                return '<button class="song-preview-button" type="button" data-preview="' + escapeHtml(song.preview) + '" aria-label="Play preview of ' + escapeHtml(title.primary) + '" title="Play preview">' +
                    '<i class="fa-solid fa-play preview-play-icon" aria-hidden="true"></i>' +
                    '<span class="preview-equalizer" aria-hidden="true"><b></b><b></b><b></b><b></b></span>' +
                    '<span class="preview-label">Preview</span></button>';
            }

            function setPreviewButtonState(button, isPlaying) {
                if (!button) return;
                var label = button.querySelector(".preview-label");
                button.classList.toggle("is-playing", isPlaying);
                button.setAttribute("aria-label", (isPlaying ? "Pause" : "Play") + " preview of " + button.closest(".song-card").querySelector(".song-title").textContent);
                button.setAttribute("title", isPlaying ? "Pause preview" : "Play preview");
                if (label) label.textContent = isPlaying ? "Pause" : "Preview";
            }

            function stopPreview(resetProgress) {
                previewPlayer.pause();
                setPreviewButtonState(activePreviewButton, false);
                if (resetProgress && activeProgressBar) activeProgressBar.style.width = "0%";
                if (resetProgress) previewPlayer.currentTime = 0;
                activePreviewButton = null;
                activeProgressBar = null;
            }

            function renderProfile() {
                var profile = profileData.profile || {};
                var instagram = profile.socials && profile.socials.instagram;
                var instagramHandle = profile.instagramHandle || String(profile.name || "ManojYaayavar").toLowerCase();
                var instagramHtml = validLink(instagram)
                    ? '<a class="instagram-link" href="' + escapeHtml(instagram) + '" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram" aria-hidden="true"></i>@' + escapeHtml(instagramHandle) + '</a>'
                    : "";
                document.getElementById("profile").innerHTML =
                    '<div class="profile__image-wrap"><img class="profile__image" src="' + escapeHtml(profile.photo || "face_pen_final.png") + '" alt="' + escapeHtml(profile.name || "ManojYaayavar") + '"></div>' +
                    '<p class="profile__eyebrow">Poet · Lyricist · Songwriter</p>' +
                    '<h1 class="profile__name">' + escapeHtml(profile.name || "ManojYaayavar") + '</h1>' +
                    '<p class="profile__bio">' + escapeHtml(profile.bio || "Songs about love, life, and everything in between\nकही और अनकही से परे कुछ शब्द") + '</p>' +
                    instagramHtml;
            }

            function renderFeatured() {
                var featured = songs.find(function (song) { return song.featured; }) || songs[0];
                var section = document.getElementById("featured-section");
                if (!featured) {
                    section.hidden = true;
                    return;
                }
                var title = splitTitle(featured.title);
                var art = validLink(featured.albumArt) ? featured.albumArt : "face_pen_final.png";
                document.getElementById("featured").innerHTML =
                    '<img class="featured__art" src="' + escapeHtml(art) + '" alt="Cover artwork for ' + escapeHtml(title.primary) + '">' +
                    '<div class="featured__copy">' +
                        '<span class="release-label">Latest song</span>' +
                        '<h3 class="featured__title">' + escapeHtml(title.primary) + '</h3>' +
                        (title.secondary ? '<p class="featured__subtitle" lang="hi">' + escapeHtml(title.secondary) + '</p>' : "") +
                        '<div class="platforms">' + platformLinks(featured.links) + '</div>' +
                    '</div>';
                section.hidden = false;
            }

            function renderArtistLinks() {
                var links = profileData.listenAll || {};
                var html = Object.keys(platformMeta).filter(function (key) {
                    return validLink(links[key]);
                }).map(function (key) {
                    var meta = platformMeta[key];
                    return '<a class="artist-link artist-link--' + key + '" href="' + escapeHtml(links[key]) + '" target="_blank" rel="noopener noreferrer">' +
                        '<i class="' + meta.icon + '" aria-hidden="true"></i><span>' + meta.label + '</span></a>';
                }).join("");
                document.getElementById("artist-links").innerHTML = html;
                document.getElementById("artist-section").hidden = !html;
            }

            function songCard(song, index) {
                var title = splitTitle(song.title);
                var art = validLink(song.albumArt)
                    ? '<img class="song-art" src="' + escapeHtml(song.albumArt) + '" alt="" loading="lazy">'
                    : '<span class="song-art-fallback" aria-hidden="true">' + escapeHtml(title.primary.charAt(0)) + '</span>';
                return '<article class="song-card" data-song-index="' + index + '">' +
                    '<div class="song-main">' +
                        art +
                        '<span class="song-copy">' +
                            '<span class="song-title">' + escapeHtml(title.primary) + '</span>' +
                            '<span class="song-subtitle">' + escapeHtml(title.secondary || "Listen now") + '</span>' +
                        '</span>' +
                        '<div class="song-direct-links" aria-label="Preview or listen to ' + escapeHtml(title.primary) + '">' + previewButton(song, title) + directSongLinks(song.links) + '</div>' +
                    '</div>' +
                    (previewEnabled && validLink(song.preview) ? '<div class="song-preview-track" aria-hidden="true"><div class="song-preview-progress"></div></div>' : '') +
                '</article>';
            }

            function filteredSongs() {
                var query = document.getElementById("search-input").value.trim().toLocaleLowerCase();
                if (!query) return songs;
                return songs.filter(function (song) {
                    return String(song.title || "").toLocaleLowerCase().includes(query);
                });
            }

            function renderCatalogue() {
                if (activePreviewButton) stopPreview(true);
                var results = filteredSongs();
                var displayed = results.slice(0, visibleCount);
                document.getElementById("song-list").innerHTML = displayed.map(songCard).join("");
                document.getElementById("song-count").textContent = results.length + (results.length === 1 ? " song" : " songs");
                document.getElementById("empty-state").style.display = results.length ? "none" : "block";

                var loadMore = document.getElementById("load-more");
                loadMore.style.display = results.length > visibleCount ? "block" : "none";
                if (results.length > visibleCount) {
                    loadMore.textContent = "Show " + Math.min(PAGE_SIZE, results.length - visibleCount) + " more songs";
                }
            }

            function showError() {
                document.getElementById("profile").innerHTML =
                    '<div class="empty-state" style="display:block">The music catalogue could not be loaded. Please refresh the page.</div>';
            }

            document.getElementById("search-input").addEventListener("input", function () {
                visibleCount = PAGE_SIZE;
                renderCatalogue();
            });

            document.getElementById("load-more").addEventListener("click", function () {
                visibleCount += PAGE_SIZE;
                renderCatalogue();
            });

            document.getElementById("song-list").addEventListener("click", function (event) {
                var button = event.target.closest(".song-preview-button");
                if (!button) return;

                if (activePreviewButton === button && !previewPlayer.paused) {
                    previewPlayer.pause();
                    return;
                }

                if (activePreviewButton && activePreviewButton !== button) {
                    stopPreview(true);
                }

                activePreviewButton = button;
                activeProgressBar = button.closest(".song-card").querySelector(".song-preview-progress");

                var requestedSource = new URL(button.dataset.preview, window.location.href).href;
                if (previewPlayer.src !== requestedSource) {
                    previewPlayer.src = requestedSource;
                    previewPlayer.load();
                }

                previewPlayer.play().catch(function (error) {
                    console.error("Preview playback failed:", error);
                    stopPreview(false);
                });
            });

            previewPlayer.addEventListener("play", function () {
                setPreviewButtonState(activePreviewButton, true);
            });

            previewPlayer.addEventListener("pause", function () {
                setPreviewButtonState(activePreviewButton, false);
            });

            previewPlayer.addEventListener("timeupdate", function () {
                if (!activeProgressBar || !Number.isFinite(previewPlayer.duration) || previewPlayer.duration <= 0) return;
                activeProgressBar.style.width = Math.min(100, (previewPlayer.currentTime / previewPlayer.duration) * 100) + "%";
            });

            previewPlayer.addEventListener("ended", function () {
                stopPreview(true);
            });

            var contentVersion = Date.now();
            Promise.all([
                fetch("site-data.json?v=" + contentVersion, { cache: "no-store" }).then(function (response) {
                    if (!response.ok) throw new Error("Could not load site data");
                    return response.json();
                }),
                fetch("songs.json?v=" + contentVersion, { cache: "no-store" }).then(function (response) {
                    if (!response.ok) throw new Error("Could not load songs");
                    return response.json();
                })
            ]).then(function (results) {
                profileData = results[0] || {};
                songs = Array.isArray(results[1].songs) ? results[1].songs : [];
                previewEnabled = Boolean(profileData.features && profileData.features.previewEnabled);
                document.getElementById("catalogue-section").classList.toggle("previews-disabled", !previewEnabled);
                renderProfile();
                renderFeatured();
                renderArtistLinks();
                renderCatalogue();
                document.getElementById("catalogue-section").hidden = false;
            }).catch(function (error) {
                console.error(error);
                showError();
            });
        }());
    </script>
</body>
</html>
